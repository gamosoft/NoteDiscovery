# NoteDiscovery Configuration

app:
  # Name shown in the UI, the login page and the browser title.
  # Override via the APP_NAME env var.
  name: "NoteDiscovery"
  
server:
  host: "0.0.0.0"
  port: 8000
  reload: false  # Set to true for development
  
  # CORS (Cross-Origin Resource Sharing) configuration
  # For self-hosted use, "*" is fine. For production, specify allowed domains.
  # Examples: ["http://localhost:8000", "https://yourdomain.com"]
  allowed_origins: ["*"]
  
  # Debug mode - shows detailed error messages (DISABLE in production!)
  debug: false

  # Optional public origin for share links (scheme + host, no trailing slash).
  # When set, the share dialog / QR / clipboard use this instead of the browser's
  # origin — useful when you browse on LAN but want links like
  # https://notes.example.com/share/... Leave empty for normal behavior.
  # Override via the SHARE_PUBLIC_ORIGIN env var.
  share_public_origin: ""
  
storage:
  notes_dir: "./data"
  plugins_dir: "./plugins"
  
search:
  enabled: true

# User interface behavior
ui:
  # Theme used when a browser has not saved a theme preference yet.
  # Use a theme ID from the themes directory (the CSS filename without .css).
  # Override via the DEFAULT_THEME env var. Invalid values fall back to 'light'.
  default_theme: "light"

  # Autosave debounce in milliseconds (applies to note typing and drawing autosave).
  # Lower = saves more often (more disk writes); higher = saves less often.
  # Override via the AUTOSAVE_DELAY_MS env var. Server clamps to 250-60000ms.
  autosave_delay_ms: 1000

authentication:
  # Authentication settings
  # Set enabled to true to require login
  enabled: false
  
  # ⚠️ SECURITY WARNING: Change these values before exposing to the internet!
  # Default values below are for LOCAL TESTING ONLY
  
  # Session secret key - CHANGE THIS TO A RANDOM STRING!
  # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "change_this_to_a_random_secret_key_in_production"
  
  # Password (hashed automatically at startup)
  # ⚠️ Default password is "admin" - CHANGE THIS for production!
  password: "admin"
  
  # Session expiry in seconds (default: 7 days)
  session_max_age: 604800
  
  # API Key Authentication (for external integrations)
  # Usage (choose one):
  #   Authorization: Bearer YOUR_API_KEY
  #   X-API-Key: YOUR_API_KEY
  #
  # Generate a secure key with:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  #
  # Leave empty to disable API key authentication (only session auth works)
  api_key: ""

mcp:
  # Serve MCP (Model Context Protocol) over Streamable HTTP at /mcp, so AI
  # assistants can connect by URL instead of spawning the stdio server.
  # Uses the same auth as the REST API. When authentication is enabled,
  # authentication.api_key must be set or the endpoint stays off.
  # Override via the MCP_ENABLED env var.
  enabled: false
